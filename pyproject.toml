[tool.uv.workspace]
members = [
  "apps/sales-agent",
  "apps/backend",
  "apps/telegram-module",
  "apps/wappi-module",
  "apps/wazzup-module",
  "libs/common",
  "scripts/manual_testing",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  "**/migrations/**",
  "**/__pycache__/**",
  "**/.venv/**",
  "storage/**"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["common", "sales_agent", "backend", "telegram_module", "wappi_module", "wazzup_module"]
known-local-folder = ["src"]

[tool.ruff.lint.per-file-ignores]
"**/api/**/*.py" = ["B008"]
"**/routers/**/*.py" = ["B008"]
"**/dependencies.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "rich>=14.3.2",
    "ruff==0.14.4",
]
