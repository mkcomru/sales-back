[project]
name = "wazzup-module"
version = "0.1.0"
description = "Transport module for Wazzup24 API (Instagram)"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.119.1",
    "uvicorn[standard]>=0.38.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.11.0",
    "structlog>=25.4.0",
    "python-dotenv>=1.1.1",
    "common",
    "pytest-cov>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.8",
    "ruff==0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wazzup_module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short"]

[tool.uv.sources]
common = { workspace = true }
